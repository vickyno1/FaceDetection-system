# ==============================================================================
# Netlify Configuration (Repository Root)
# Ensures automated, error-free deployment of the React Vite Frontend
# ==============================================================================

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Support React Router Single Page Application (SPA) navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
